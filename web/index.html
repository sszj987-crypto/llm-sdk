<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Agent</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <!-- Settings Page -->
      <div id="settingsPage" class="page">
        <header>
          <h1>LLM Agent</h1>
          <p>设置</p>
        </header>

        <section class="panel">
          <div class="grid">
            <fieldset>
              <legend>Profiles</legend>
              <label>
                当前 Profile
                <select id="profileSelect"></select>
              </label>
              <div class="inline-actions">
                <button id="newProfileBtn" type="button">新增</button>
                <button id="deleteProfileBtn" type="button" class="ghost-btn">删除</button>
              </div>
            </fieldset>

            <fieldset>
              <legend>Profile Config</legend>
              <label>ID <input id="profileId" placeholder="gemini-main" /></label>
              <label>Name <input id="profileName" placeholder="Gemini Main" /></label>
              <label>
                Provider 类型
                <select id="provider">
                  <option value="openai">OpenAI-compatible</option>
                  <option value="gemini">Gemini</option>
                </select>
              </label>
              <label>URL <input id="baseURL" placeholder="https://generativelanguage.googleapis.com/v1beta/openai" /></label>
              <label>API Key <input id="apiKey" type="password" /></label>
              <label>Model <input id="model" placeholder="gemini-2.5-flash" /></label>
              <label>
                Route Mode
                <select id="routeMode">
                  <option value="direct">direct</option>
                  <option value="worker_sni">worker_sni</option>
                </select>
              </label>
              <label>Worker URL <input id="workerURL" placeholder="https://sszj.me (worker_sni 时填写)" /></label>
              <label class="checkbox-label">
                <input type="checkbox" id="quicEnable" />
                <span>HTTP3 / QUIC</span>
              </label>
            </fieldset>
          </div>

          <div class="settings-actions">
            <button id="saveBtn">保存</button>
            <button id="diagnoseBtn" type="button">诊断</button>
            <button id="goChatBtn">进入聊天</button>
          </div>

          <div id="diagnosePanel" class="diagnose-panel" hidden>
            <h2>诊断结果</h2>
            <div id="diagnoseSummary" class="diagnose-summary"></div>
            <table>
              <tbody id="diagnoseTable"></tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- Chat Page -->
      <div id="chatPage" class="page" style="display:none">
        <header>
          <div>
            <h1>LLM Agent</h1>
            <p id="chatProviderLabel">聊天</p>
          </div>
          <button id="goSettingsBtn" class="ghost-btn">设置</button>
        </header>

        <section class="panel">
          <div class="chat">
            <div id="messages" class="messages"></div>
            <div class="composer">
              <textarea id="prompt" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
              <div class="composer-footer">
                <button id="sendBtn">发送</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
