<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Agent</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <!-- Settings Page -->
      <div id="settingsPage" class="page">
        <header>
          <h1>LLM Agent</h1>
          <p>设置</p>
        </header>

        <section class="panel">
          <div class="grid">
            <fieldset>
              <legend>Provider</legend>
              <label>URL <input id="baseURL" placeholder="https://generativelanguage.googleapis.com/v1beta/openai" /></label>
              <label>API Key <input id="apiKey" type="password" /></label>
              <label>Model <input id="model" placeholder="gemini-2.5-flash" /></label>
              <label>Worker URL <input id="workerURL" placeholder="https://sszj.me (可选)" /></label>
              <label>
                Provider 类型
                <select id="provider">
                  <option value="openai">OpenAI-compatible</option>
                  <option value="gemini">Gemini</option>
                </select>
              </label>
            </fieldset>

          </div>

          <div class="settings-actions">
            <button id="saveBtn">保存</button>
            <button id="goChatBtn">进入聊天</button>
          </div>
        </section>
      </div>

      <!-- Chat Page -->
      <div id="chatPage" class="page" style="display:none">
        <header>
          <div>
            <h1>LLM Agent</h1>
            <p id="chatProviderLabel">聊天</p>
          </div>
          <button id="goSettingsBtn" class="ghost-btn">设置</button>
        </header>

        <section class="panel">
          <div class="chat">
            <div id="messages" class="messages"></div>
            <div class="composer">
              <textarea id="prompt" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
              <div class="composer-footer">
                <button id="sendBtn">发送</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
